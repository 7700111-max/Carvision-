<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя коллекция авто</title>
    
    <!-- Библиотека для удаления фона -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.0/dist/background-removal.umd.js">
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: white;
            padding: 16px 16px 100px 16px;
            min-height: 100vh;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcbff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #1a1a2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            flex: 0.3;
            min-width: 60px;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        
        .stats {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
        }
        
        .stats span {
            color: white;
            font-weight: 600;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        
        .card {
            background: #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
            cursor: pointer;
        }
        
        .card:active {
            transform: scale(0.96);
        }
        
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background: #111;
        }
        
        .card-info {
            padding: 10px 12px 12px 12px;
        }
        
        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-subtitle {
            font-size: 11px;
            color: #888;
        }
        
        .card-rarity {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .rarity-common { background: #555; color: #ccc; }
        .rarity-rare { background: #2d7d9a; color: #fff; }
        .rarity-epic { background: #7b2fbe; color: #fff; }
        .rarity-legendary { background: #ff8c00; color: #fff; }
        .rarity-mythic { background: #ff0040; color: #fff; box-shadow: 0 0 20px rgba(255,0,64,0.3); }
        
        .card-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        
        .card-delete:active {
            transform: scale(0.85);
            background: #ff0040;
        }
        
        /* Модальное окно для увеличения */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(12px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal img {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        
        .modal-info {
            color: white;
            text-align: center;
            margin-top: 16px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }
        
        .modal-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 32px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal-close:active {
            transform: scale(0.9);
            background: rgba(255,0,0,0.3);
        }
        
        /* Загрузчик */
        .loader {
            display: none;
            text-align: center;
            padding: 30px;
            color: #888;
        }
        
        .loader.active {
            display: block;
        }
        
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a2e;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-text {
            font-size: 14px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }
        
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        
        .empty-state h3 {
            color: #888;
            margin-bottom: 8px;
        }
        
        /* Адаптив */
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            
            .btn {
                font-size: 14px;
                padding: 12px 16px;
                min-width: 80px;
            }
            
            .card-title {
                font-size: 12px;
            }
            
            .modal img {
                max-height: 50vh;
            }
        }
        
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>

    <h1>🏎 Моя коллекция</h1>
    <p class="subtitle">Автомобили, которые я сфоткал</p>
    
    <div class="btn-group">
        <button class="btn btn-primary" id="cameraBtn">📷 Снять фото</button>
        <button class="btn btn-secondary" id="galleryBtn">🖼 Выбрать фото</button>
        <button class="btn btn-success" id="clearBtn">🗑 Очистить всё</button>
    </div>
    
    <div class="stats">
        <div>📸 Всего: <span id="totalCount">0</span></div>
        <div>⚡ Легендарных: <span id="legendaryCount">0</span></div>
    </div>
    
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text" id="loaderText">Обработка фото...</div>
    </div>
    
    <div class="gallery" id="gallery"></div>
    
    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">✕</button>
        <div style="text-align:center;max-width:600px;width:100%;">
            <img id="modalImg" src="" alt="Авто">
            <div class="modal-info" id="modalInfo"></div>
        </div>
    </div>
    
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

    <script>
        // ============================================================
        // КОНФИГУРАЦИЯ
        // ============================================================
        const CONFIG = {
            GEMINI_API_KEY: 'AIzaSyC42Ho4cnyESQPL4mJjXUENCfhB6QxV8U4', // <--- ЗАМЕНИТЕ
            GEMINI_MODEL: 'gemini-2.5-flash',
            MAX_IMAGE_WIDTH: 800,
            IMAGE_QUALITY: 0.7,
            STORAGE_KEY: 'my_car_collection',
        };
        
        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let collection = [];
        let isProcessing = false;
        
        // ============================================================
        // ЗАГРУЗКА КОЛЛЕКЦИИ
        // ============================================================
        function loadCollection() {
            try {
                const data = localStorage.getItem(CONFIG.STORAGE_KEY);
                collection = data ? JSON.parse(data) : [];
            } catch {
                collection = [];
            }
            renderGallery();
        }
        
        function saveCollection() {
            try {
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(collection));
            } catch (e) {
                alert('❌ Не хватило места в хранилище. Попробуйте удалить несколько карточек.');
                console.error(e);
            }
            renderGallery();
        }
        
        // ============================================================
        // ОТРИСОВКА ГАЛЕРЕИ
        // ============================================================
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const total = document.getElementById('totalCount');
            const legendary = document.getElementById('legendaryCount');
            
            total.textContent = collection.length;
            legendary.textContent = collection.filter(c => c.rarity === 'legendary' || c.rarity === 'mythic').length;
            
            if (collection.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <div class="icon">📸</div>
                        <h3>Пока нет машин</h3>
                        <p style="color:#666;">Сфоткайте авто или выберите из галереи</p>
                    </div>
                `;
                return;
            }
            
            gallery.innerHTML = collection.map((item, index) => `
                <div class="card" data-index="${index}">
                    <img src="${item.thumbnail}" alt="${item.make} ${item.model}" loading="lazy">
                    <button class="card-delete" data-index="${index}">✕</button>
                    <div class="card-info">
                        <div class="card-title">${item.make} ${item.model}</div>
                        <div class="card-subtitle">${item.year || '?'} • ${item.bodyType || '?'}</div>
                        <span class="card-rarity rarity-${item.rarity || 'common'}">${item.rarity || 'Обычный'}</span>
                    </div>
                </div>
            `).join('');
            
            // Клик по карточке — увеличение
            document.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.card-delete')) return;
                    const idx = parseInt(this.dataset.index);
                    openModal(idx);
                });
            });
            
            // Удаление
            document.querySelectorAll('.card-delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index);
                    if (confirm('Удалить эту машину из коллекции?')) {
                        collection.splice(idx, 1);
                        saveCollection();
                    }
                });
            });
        }
        
        // ============================================================
        // МОДАЛЬНОЕ ОКНО
        // ============================================================
        function openModal(index) {
            const item = collection[index];
            if (!item) return;
            
            document.getElementById('modalImg').src = item.thumbnail;
            document.getElementById('modalInfo').innerHTML = `
                <div style="font-size:22px;font-weight:700;margin-bottom:4px;">
                    ${item.make} ${item.model}
                </div>
                <div style="font-size:14px;color:#aaa;">
                    ${item.year || 'Год неизвестен'} • ${item.bodyType || 'Тип кузова неизвестен'}
                </div>
                <div style="font-size:16px;margin-top:6px;font-weight:600;color:${getRarityColor(item.rarity)}">
                    ${item.rarity || 'Обычный'}
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }
        
        function getRarityColor(rarity) {
            const map = {
                'common': '#ccc',
                'rare': '#2d7d9a',
                'epic': '#7b2fbe',
                'legendary': '#ff8c00',
                'mythic': '#ff0040'
            };
            return map[rarity] || '#ccc';
        }
        
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('modal').classList.remove('active');
            }
        });
        
        // ============================================================
        // СЖАТИЕ ФОТО
        // ============================================================
        function compressImage(file, maxWidth = CONFIG.MAX_IMAGE_WIDTH, quality = CONFIG.IMAGE_QUALITY) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ratio = Math.min(maxWidth / img.width, 1);
                        canvas.width = img.width * ratio;
                        canvas.height = img.height * ratio;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        // ============================================================
        // УДАЛЕНИЕ ФОНА (@imgly/background-removal)
        // ============================================================
        async function removeBackground(imageDataUrl) {
            try {
                // Библиотека загружается при первом вызове (~40MB)
                const result = await window.removeBackground(imageDataUrl);
                return result;
            } catch (error) {
                console.warn('Удаление фона не удалось, используем оригинал:', error);
                return imageDataUrl; // fallback
            }
        }
        
        // ============================================================
        // РАСПОЗНАВАНИЕ АВТО ЧЕРЕЗ GEMINI
        // ============================================================
        async function recognizeCar(imageDataUrl) {
            const prompt = `
                Определи автомобиль на фото.
                Верни ТОЛЬКО JSON в формате:
                {
                    "make": "Марка (на русском)",
                    "model": "Модель (на русском)",
                    "year": "Год выпуска (только число)",
                    "bodyType": "Тип кузова (седан/хэтчбек/внедорожник/купе/кабриолет/универсал/минивэн/пикап/другое)",
                    "rarity": "одно из: common, rare, epic, legendary, mythic"
                }
                
                Критерии редкости (определяй строго):
                - mythic: гиперкары (Bugatti, Koenigsegg, Rimac, Pagani, и т.п.) или стоимость > $2,000,000
                - legendary: суперкары (Ferrari, Lamborghini, McLaren, Porsche 911 Turbo S+, и т.п.) или лимитированные серии
                - epic: спортивные авто (Porsche Cayman, Nissan GT-R, Corvette, BMW M, Mercedes AMG, и т.п.)
                - rare: необычные/редкие модели (Alfa Romeo, Lancia, DeLorean, старые японские, и т.п.)
                - common: обычные гражданские авто (Toyota, Honda, VW, Kia, и т.п.)
                
                Если не уверен в годе, поставь "unknown".
                Если не уверен в типе кузова, поставь "unknown".
                Если не уверен в марке/модели, напиши то, что видишь максимально точно.
                Ответь ТОЛЬКО JSON, без пояснений.
            `;
            
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: 'image/jpeg', data: imageDataUrl.split(',')[1] } }
                            ]
                        }]
                    })
                }
            );
            
            if (!response.ok) {
                const err = await response.text();
                throw new Error(`Gemini API ошибка: ${err}`);
            }
            
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            
            // Парсим JSON из ответа
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('Не удалось распарсить ответ ИИ');
            
            const result = JSON.parse(jsonMatch[0]);
            
            // Валидация полей
            return {
                make: result.make || 'Неизвестно',
                model: result.model || 'Неизвестно',
                year: result.year || 'unknown',
                bodyType: result.bodyType || 'unknown',
                rarity: ['common', 'rare', 'epic', 'legendary', 'mythic'].includes(result.rarity) ? result.rarity :
                    'common'
            };
        }
        
        // ============================================================
        // ОСНОВНОЙ ПРОЦЕСС: ЗАГРУЗКА → ОБРАБОТКА → СОХРАНЕНИЕ
        // ============================================================
        async function processImage(file) {
            if (isProcessing) return;
            isProcessing = true;
            
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            loader.classList.add('active');
            
            try {
                // Шаг 1: Сжатие
                loaderText.textContent = '📦 Сжатие фото...';
                const compressed = await compressImage(file);
                
                // Шаг 2: Удаление фона
                loaderText.textContent = '🎨 Удаление фона (это может занять 10-20 сек)...';
                const noBg = compressed;
                
                // Шаг 3: Распознавание через Gemini
                loaderText.textContent = '🧠 Распознавание авто...';
                const carData = await recognizeCar(noBg);
                
                // Шаг 4: Сохранение
                const newCard = {
                    id: Date.now(),
                    thumbnail: noBg,
                    make: carData.make,
                    model: carData.model,
                    year: carData.year,
                    bodyType: carData.bodyType,
                    rarity: carData.rarity,
                    dateAdded: new Date().toISOString()
                };
                
                collection.unshift(newCard);
                saveCollection();
                
                loaderText.textContent = '✅ Готово!';
                setTimeout(() => loader.classList.remove('active'), 500);
                
            } catch (error) {
                console.error(error);
                loaderText.textContent = '❌ Ошибка: ' + error.message;
                alert('❌ Не удалось обработать фото: ' + error.message);
                setTimeout(() => loader.classList.remove('active'), 2000);
            } finally {
                isProcessing = false;
            }
        }
        
        // ============================================================
        // ЗАГРУЗКА ФАЙЛОВ
        // ============================================================
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Пожалуйста, выберите фото');
                return;
            }
            processImage(file);
        }
        
        // Кнопка "Выбрать из галереи"
        document.getElementById('galleryBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
            e.target.value = '';
        });
        
        // Кнопка "Снять фото"
        document.getElementById('cameraBtn').addEventListener('click', () => {
            document.getElementById('cameraInput').click();
        });
        document.getElementById('cameraInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
            e.target.value = '';
        });
        
        // Кнопка "Очистить всё"
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (collection.length === 0) return;
            if (confirm('🗑 Удалить ВСЕ карточки? Это необратимо!')) {
                collection = [];
                saveCollection();
            }
        });
        
        // ============================================================
        // ЗАПУСК
        // ============================================================
        loadCollection();
        
        console.log('🏎 My Car Collection ready!');
        console.log(`📸 Всего машин: ${collection.length}`);
    </script>

</body>
</html>
