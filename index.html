<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>CarVision — Hugging Face</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 16px;
            color: white;
        }
        .app {
            max-width: 430px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border-radius: 32px;
            padding: 20px 16px 32px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-bottom: 16px;
        }
        
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-box {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-box .num { font-size: 22px; font-weight: 700; color: #667eea; }
        .stat-box .label { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 2px; }
        
        .key-input-area {
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .key-input-row {
            display: flex;
            gap: 8px;
        }
        .key-input-row input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 13px;
            font-family: monospace;
            outline: none;
        }
        .key-input-row input:focus { border-color: #667eea; }
        .key-input-row input::placeholder {
            color: rgba(255,255,255,0.2);
            font-family: -apple-system, sans-serif;
        }
        .key-input-row button {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .key-input-row button:active { transform: scale(0.95); }
        .key-status {
            font-size: 11px;
            margin-top: 4px;
            color: rgba(255,255,255,0.3);
        }
        .key-status.ok { color: #34a853; }
        .key-status.error { color: #ea4335; }
        
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-gallery {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-camera {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .file-input-hidden { display: none; }
        
        #previewWrapper {
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 14px;
            display: none;
            background: #111;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        #previewWrapper.active { display: block; }
        #previewImage {
            width: 100%;
            display: block;
            max-height: 280px;
            object-fit: contain;
        }
        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .remove-btn:active { transform: scale(0.9); }
        
        .analyze-row { margin-bottom: 14px; }
        .analyze-row .btn { width: 100%; }
        
        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #message {
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            display: none;
            margin-bottom: 12px;
        }
        #message.active { display: block; animation: fadeIn 0.3s; }
        #message.success { background: rgba(52,168,83,0.12); border: 1px solid rgba(52,168,83,0.2); color: #34a853; }
        #message.error { background: rgba(255,59,48,0.12); border: 1px solid rgba(255,59,48,0.2); color: #ff6b6b; }
        #message.info { background: rgba(255,193,7,0.12); border: 1px solid rgba(255,193,7,0.2); color: #ffc107; }
        
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: rgba(102,126,234,0.15);
            color: #667eea;
        }
        .tab:active { transform: scale(0.95); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .collection-item {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .collection-item .thumb {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            background: #111;
        }
        .collection-item .info {
            padding: 8px 10px 10px;
        }
        .collection-item .brand {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
        }
        .collection-item .model {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
        }
        .collection-item .details {
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            margin-top: 2px;
        }
        .collection-item .rare-badge {
            display: inline-block;
            font-size: 14px;
            margin-left: 4px;
        }
        
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .achievement {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
            opacity: 0.3;
            transition: all 0.5s;
        }
        .achievement.unlocked { opacity: 1; border-color: rgba(102,126,234,0.3); background: rgba(102,126,234,0.08); }
        .achievement .emoji { font-size: 24px; display: block; }
        .achievement .name { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 2px; }
        .achievement.unlocked .name { color: rgba(255,255,255,0.7); }
        .achievement .progress { font-size: 8px; color: rgba(255,255,255,0.2); margin-top: 2px; }
        .achievement.unlocked .progress { color: #667eea; }
        
        .empty-collection {
            text-align: center;
            color: rgba(255,255,255,0.15);
            font-size: 13px;
            padding: 30px 0;
            grid-column: 1 / -1;
        }
        .empty-collection .icon { font-size: 40px; display: block; margin-bottom: 8px; }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.06);
            font-size: 9px;
            margin-top: 16px;
            letter-spacing: 0.3px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app">
    <h1>🚗 CarVision</h1>
    <div class="subtitle">Работает на Hugging Face</div>

    <!-- Статистика -->
    <div class="stats-row">
        <div class="stat-box"><div class="num" id="totalCars">0</div><div class="label">Всего машин</div></div>
        <div class="stat-box"><div class="num" id="uniqueBrands">0</div><div class="label">Уникальных марок</div></div>
        <div class="stat-box"><div class="num" id="achievementsCount">0</div><div class="label">Достижений</div></div>
    </div>

    <!-- Ключ -->
    <div class="key-input-area">
        <div class="key-input-row">
            <input type="text" id="apiKeyInput" placeholder="Вставь Hugging Face API ключ...">
            <button id="saveKeyBtn">Сохранить</button>
        </div>
        <div class="key-status" id="keyStatus">Вставь ключ чтобы начать</div>
    </div>

    <!-- Кнопки для iPhone -->
    <div class="btn-row">
        <button class="btn btn-gallery" id="galleryBtn">🖼️ Галерея</button>
        <button class="btn btn-camera" id="cameraBtn">📷 Камера</button>
    </div>

    <!-- Скрытые инпуты -->
    <input type="file" id="fileInput" class="file-input-hidden" accept="image/*">
    <input type="file" id="cameraInput" class="file-input-hidden" accept="image/*" capture="environment">

    <!-- Превью -->
    <div id="previewWrapper">
        <img id="previewImage" alt="Preview">
        <button class="remove-btn" id="removeBtn">✕</button>
    </div>

    <!-- Кнопка распознавания -->
    <div class="analyze-row">
        <button class="btn btn-primary" id="analyzeBtn" disabled>🔍 Распознать</button>
    </div>

    <div id="message"></div>

    <!-- Табы -->
    <div class="tabs">
        <button class="tab active" data-tab="collection">📚 Коллекция</button>
        <button class="tab" data-tab="achievements">🏆 Достижения</button>
    </div>

    <!-- Коллекция -->
    <div class="tab-content active" id="tabCollection">
        <div class="collection-grid" id="collectionGrid"></div>
    </div>

    <!-- Достижения -->
    <div class="tab-content" id="tabAchievements">
        <div class="achievement-grid" id="achievementGrid"></div>
    </div>

    <div class="footer">Бесплатно • Без карты • Работает на iPhone</div>
</div>

<script>
// ============================================================
// 🎯 HUGGING FACE API
// ============================================================
// Модель для распознавания автомобилей
// Можно заменить на другую: https://huggingface.co/models?pipeline_tag=image-classification&search=car
const HF_MODEL = 'microsoft/resnet-50'; // Базовая модель для классификации
// Или используй специальную модель для авто:
// const HF_MODEL = 'nikolai-git/car-recognition-ai';

const API_URL = `https://api-inference.huggingface.co/models/${HF_MODEL}`;

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let currentFile = null;
let currentImageDataUrl = null;
let isProcessing = false;
let apiKey = localStorage.getItem('hf_api_key') || '';

let collection = JSON.parse(localStorage.getItem('car_collection')) || { cars: [] };

const RARE_BRANDS = ['bugatti','koenigsegg','pagani','aston martin','mclaren','lamborghini','ferrari','maserati','rolls royce','bentley','maybach','porsche'];

// Достижения
const ACHIEVEMENTS = {
    first_car: { emoji: '🏁', name: 'Первый автомобиль', check: () => collection.cars.length >= 1 },
    five_cars: { emoji: '🚗', name: 'Автолюбитель', check: () => collection.cars.length >= 5 },
    ten_cars: { emoji: '🚙', name: 'Коллекционер', check: () => collection.cars.length >= 10 },
    three_brands: { emoji: '🏎️', name: 'Разнообразие', check: () => { const brands = new Set(collection.cars.map(c => c.brand?.toLowerCase())); return brands.size >= 3; } },
    rare_car: { emoji: '🌟', name: 'Редкая находка', check: () => collection.cars.some(c => c.rare) },
};

// ============================================================
// DOM
// ============================================================
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const keyStatus = document.getElementById('keyStatus');
const galleryBtn = document.getElementById('galleryBtn');
const cameraBtn = document.getElementById('cameraBtn');
const fileInput = document.getElementById('fileInput');
const cameraInput = document.getElementById('cameraInput');
const previewWrapper = document.getElementById('previewWrapper');
const previewImage = document.getElementById('previewImage');
const removeBtn = document.getElementById('removeBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const message = document.getElementById('message');
const collectionGrid = document.getElementById('collectionGrid');
const achievementGrid = document.getElementById('achievementGrid');
const totalCarsEl = document.getElementById('totalCars');
const uniqueBrandsEl = document.getElementById('uniqueBrands');
const achievementsCountEl = document.getElementById('achievementsCount');

// ============================================================
// КЛЮЧ
// ============================================================
if (apiKey) {
    apiKeyInput.value = apiKey;
    keyStatus.textContent = '✅ Ключ загружен';
    keyStatus.className = 'key-status ok';
}

saveKeyBtn.onclick = () => {
    const key = apiKeyInput.value.trim();
    if (!key) {
        keyStatus.textContent = '❌ Введи ключ!';
        keyStatus.className = 'key-status error';
        return;
    }
    apiKey = key;
    localStorage.setItem('hf_api_key', key);
    keyStatus.textContent = '✅ Ключ сохранён!';
    keyStatus.className = 'key-status ok';
};

// ============================================================
// ЗАГРУЗКА ФОТО
// ============================================================
function loadFile(file) {
    if (!file) return;
    currentFile = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
        currentImageDataUrl = ev.target.result;
        previewImage.src = currentImageDataUrl;
        previewWrapper.classList.add('active');
        analyzeBtn.disabled = false;
        message.classList.remove('active');
    };
    reader.readAsDataURL(file);
}

galleryBtn.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) loadFile(file);
    fileInput.value = '';
};

cameraBtn.onclick = () => cameraInput.click();
cameraInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) loadFile(file);
    cameraInput.value = '';
};

removeBtn.onclick = () => {
    currentFile = null;
    currentImageDataUrl = null;
    previewImage.src = '';
    previewWrapper.classList.remove('active');
    analyzeBtn.disabled = true;
    message.classList.remove('active');
    fileInput.value = '';
    cameraInput.value = '';
};

// ============================================================
// СЖАТИЕ ФОТО
// ============================================================
function resizeImage(dataUrl, maxWidth = 800, maxHeight = 600, quality = 0.5) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            let width = img.width;
            let height = img.height;
            
            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }
            if (height > maxHeight) {
                width = (width * maxHeight) / height;
                height = maxHeight;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = dataUrl;
    });
}

function resizeThumbnail(dataUrl, maxWidth = 300, maxHeight = 200, quality = 0.6) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            let width = img.width;
            let height = img.height;
            
            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }
            if (height > maxHeight) {
                width = (width * maxHeight) / height;
                height = maxHeight;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = dataUrl;
    });
}

// ============================================================
// РАСПОЗНАВАНИЕ ЧЕРЕЗ HUGGING FACE
// ============================================================
async function recognizeCar(imageBase64) {
    // Hugging Face ожидает бинарные данные, а не JSON
    const binaryData = atob(imageBase64);
    const bytes = new Uint8Array(binaryData.length);
    for (let i = 0; i < binaryData.length; i++) {
        bytes[i] = binaryData.charCodeAt(i);
    }
    const blob = new Blob([bytes], { type: 'image/jpeg' });

    const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'image/jpeg'
        },
        body: blob
    });

    if (!response.ok) {
        const errorText = await response.text();
        // Если модель грузится — ждём
        if (response.status === 503) {
            throw new Error('Модель загружается, попробуй через 10 секунд');
        }
        throw new Error(errorText || `Ошибка ${response.status}`);
    }

    return await response.json();
}

// ============================================================
// ОБРАБОТКА РЕЗУЛЬТАТОВ HF
// ============================================================
function parseHuggingFaceResult(data) {
    // Hugging Face возвращает массив: [{label: "car", score: 0.98}, ...]
    if (!Array.isArray(data) || data.length === 0) {
        return { brand: 'Unknown', model: '', confidence: 0 };
    }

    // Ищем метку, которая похожа на марку машины
    const carLabels = data.filter(item => 
        item.label.toLowerCase().includes('car') || 
        item.label.toLowerCase().includes('vehicle') ||
        item.label.toLowerCase().includes('auto')
    );

    // Если есть метка с машиной — берём её
    if (carLabels.length > 0) {
        const top = carLabels[0];
        // Парсим марку из метки (убираем "car", "vehicle" и т.д.)
        let brand = top.label.replace(/car/gi, '').replace(/vehicle/gi, '').replace(/auto/gi, '').trim();
        if (!brand) brand = 'Car';
        return {
            brand: brand.charAt(0).toUpperCase() + brand.slice(1),
            model: '',
            confidence: top.score || 0
        };
    }

    // Если нет явной машины — берём самую вероятную метку
    const top = data[0];
    return {
        brand: top.label.charAt(0).toUpperCase() + top.label.slice(1),
        model: '',
        confidence: top.score || 0
    };
}

// ============================================================
// КОЛЛЕКЦИЯ
// ============================================================
function addToCollection(carData, thumbnail) {
    const brand = carData.brand || 'Unknown';
    const model = carData.model || '';
    const confidence = carData.confidence || 0;
    const isRare = RARE_BRANDS.some(r => brand.toLowerCase().includes(r));

    // Проверяем дубликат
    const exists = collection.cars.some(c => 
        c.brand?.toLowerCase() === brand.toLowerCase()
    );

    if (!exists) {
        collection.cars.push({
            brand,
            model: model || brand,
            year: 'N/A',
            color: 'N/A',
            confidence: Math.round(confidence * 100),
            rare: isRare,
            date: new Date().toISOString(),
            thumbnail: thumbnail
        });

        saveCollection();
        updateUI();
        checkAchievements();
        return true;
    }
    return false;
}

function saveCollection() {
    localStorage.setItem('car_collection', JSON.stringify(collection));
}

// ============================================================
// ДОСТИЖЕНИЯ
// ============================================================
function checkAchievements() {
    let unlocked = JSON.parse(localStorage.getItem('unlocked_achievements')) || [];

    Object.keys(ACHIEVEMENTS).forEach(key => {
        if (ACHIEVEMENTS[key].check() && !unlocked.includes(key)) {
            unlocked.push(key);
            setTimeout(() => {
                showMessage(`🏆 Достижение: ${ACHIEVEMENTS[key].emoji} ${ACHIEVEMENTS[key].name}`, 'success');
            }, 500);
        }
    });

    localStorage.setItem('unlocked_achievements', JSON.stringify(unlocked));
    updateAchievements();
}

function updateAchievements() {
    const unlocked = JSON.parse(localStorage.getItem('unlocked_achievements')) || [];
    achievementGrid.innerHTML = '';

    Object.keys(ACHIEVEMENTS).forEach(key => {
        const ach = ACHIEVEMENTS[key];
        const isUnlocked = unlocked.includes(key);
        const div = document.createElement('div');
        div.className = `achievement ${isUnlocked ? 'unlocked' : ''}`;
        div.innerHTML = `
            <span class="emoji">${ach.emoji}</span>
            <span class="name">${ach.name}</span>
            <span class="progress">${isUnlocked ? '✅' : '🔒'}</span>
        `;
        achievementGrid.appendChild(div);
    });

    achievementsCountEl.textContent = unlocked.length;
}

// ============================================================
// UI
// ============================================================
function updateUI() {
    totalCarsEl.textContent = collection.cars.length;
    const brands = new Set(collection.cars.map(c => c.brand?.toLowerCase()));
    uniqueBrandsEl.textContent = brands.size;
    renderCollection();
    updateAchievements();
}

function renderCollection() {
    collectionGrid.innerHTML = '';

    if (collection.cars.length === 0) {
        collectionGrid.innerHTML = `
            <div class="empty-collection">
                <span class="icon">📭</span>
                Нет машин в коллекции
            </div>
        `;
        return;
    }

    const sorted = [...collection.cars].reverse();
    sorted.forEach(car => {
        const div = document.createElement('div');
        div.className = 'collection-item';
        const thumb = car.thumbnail || '';
        div.innerHTML = `
            <img class="thumb" src="${thumb}" alt="${car.brand}" loading="lazy">
            <div class="info">
                <div class="brand">${car.brand} ${car.rare ? '🌟' : ''}</div>
                <div class="model">${car.model}</div>
                <div class="details">Уверенность: ${car.confidence}%</div>
            </div>
        `;
        collectionGrid.appendChild(div);
    });
}

function showMessage(text, type = 'info') {
    message.textContent = text;
    message.className = 'active ' + type;
    setTimeout(() => {
        message.classList.remove('active');
    }, 4000);
}

// ============================================================
// ГЛАВНАЯ КНОПКА
// ============================================================
analyzeBtn.onclick = async () => {
    if (!currentFile || isProcessing) return;
    
    if (!apiKey) {
        showMessage('❌ Вставь Hugging Face API-ключ', 'error');
        return;
    }

    isProcessing = true;
    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<span class="loader"></span> Распознаю...';
    message.classList.remove('active');

    try {
        // Сжимаем фото перед отправкой
        const compressed = await resizeImage(currentImageDataUrl, 800, 600, 0.5);
        const base64 = compressed.split(',')[1];
        
        const result = await recognizeCar(base64);
        const parsed = parseHuggingFaceResult(result);
        
        // Миниатюра для коллекции
        const thumbnail = await resizeThumbnail(currentImageDataUrl, 300, 200, 0.6);
        
        const added = addToCollection(parsed, thumbnail);
        
        if (added) {
            showMessage(`✅ Добавлено: ${parsed.brand} (${Math.round(parsed.confidence * 100)}%)`, 'success');
        } else {
            showMessage(`ℹ️ ${parsed.brand} уже есть в коллекции`, 'info');
        }

        setTimeout(() => removeBtn.click(), 1500);

    } catch (error) {
        showMessage('❌ Ошибка: ' + error.message, 'error');
        console.error('Ошибка:', error);
    }

    isProcessing = false;
    analyzeBtn.disabled = false;
    analyzeBtn.innerHTML = '🔍 Распознать';
};

// ============================================================
// ТАБЫ
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.getElementById(`tab${tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)}`).classList.add('active');
    };
});

// ============================================================
// СТАРТ
// ============================================================
updateUI();
</script>
</body>
</html>
